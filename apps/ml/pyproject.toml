[project]
name = "csas-ml"
version = "0.1.0"
description = "C.S.A.S machine-learning service: classification, embeddings and confidence scoring."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.159.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.12.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.1",
    "mypy>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Chosen rather than "everything": correctness and security rules, plus the
# import/typing hygiene that keeps a service this small readable.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "S",           # bandit (security)
    "A",           # builtin shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes
    "T20",         # no print()
    "SIM",         # simplify
    "PTH",         # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may hard-code sample credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
