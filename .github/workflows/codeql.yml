name: CodeQL

# Static analysis for JavaScript/TypeScript and Python. Free for public
# repositories; results appear under Security -> Code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code too.
    - cron: '37 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning needs GitHub Advanced Security on a private repository; it
    # is free only for public ones. Until this repo is public the job cannot
    # succeed, and a permanently red check is worse than an absent one —
    # people stop reading the whole list. It starts working by itself on the
    # day the repository is made public, with no edit here.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
