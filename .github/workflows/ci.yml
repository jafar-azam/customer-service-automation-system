name: CI

# Must pass on GitHub Actions' free tier for public repositories, with no
# secrets configured: every external provider is mocked, so nothing here needs
# an API key, a GPU, or a paid runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Split from the heavier jobs so a formatting slip fails in under a minute
  # instead of burning the whole matrix.
  quality:
    name: Lint, types and tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Security checklist is internally consistent
        run: npm run audit:checklist
      - name: No local-only personal data in tracked files
        # A no-op on a runner, which never holds the file. It runs here so a
        # broken scanner is caught by CI rather than by the pre-commit hook of
        # the one person who does hold it.
        run: npm run scan:personal-data
      - name: Palette meets WCAG 2.1 AA
        # Computed from docs/design/palettes.json, not asserted. jsdom has no
        # layout engine, so axe cannot check contrast in the component tests;
        # this is the half of the coverage those tests cannot provide.
        run: npm run check:contrast
      - name: Generated files match their sources
        # tokens.css, the design previews and the CLDR audit are all generated.
        # Regenerating and diffing catches the case where someone edits the
        # output by hand, or changes a generator and forgets to rebuild.
        run: |
          npm run build:tokens
          npm run build:previews
          npm run audit:cldr
          git diff --exit-code -- apps/client/src/styles/tokens.css docs/design
      - name: Type-check and build
        run: npm run build
      - name: Tests with coverage
        # Includes the axe pass over the application in Arabic and English,
        # light and dark (apps/client/src/App.test.tsx).
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  ml:
    name: Lint, types and tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/ml/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy app tests
      - name: Tests
        run: uv run pytest -q

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scanner walks every blob ever committed, so it needs them all.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan working tree
        run: node scripts/secret-scan.mjs
      - name: Scan entire git history
        run: node scripts/secret-scan.mjs --history

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/ml/uv.lock
      - name: pip-audit
        working-directory: apps/ml
        run: |
          uv export --frozen --no-dev --no-emit-project > requirements.txt
          uvx pip-audit --requirement requirements.txt --strict

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: ML image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ml/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Client image (static build)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/client/Dockerfile
          target: serve
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Stack starts and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate .env
        run: node scripts/setup.mjs
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: The API answers through the reverse proxy
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/version | tee /dev/stderr | grep -q '"name":"csas-server"'
      - name: The ML service refuses an unauthenticated call
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/version)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
