name: CI

# Must pass on GitHub Actions' free tier for public repositories, with no
# secrets configured: every external provider is mocked, so nothing here needs
# an API key, a GPU, or a paid runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Split from the heavier jobs so a formatting slip fails in under a minute
  # instead of burning the whole matrix.
  quality:
    name: Lint, types and tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Security checklist is internally consistent
        run: npm run audit:checklist
      - name: No local-only personal data in tracked files
        # A no-op on a runner, which never holds the file. It runs here so a
        # broken scanner is caught by CI rather than by the pre-commit hook of
        # the one person who does hold it.
        run: npm run scan:personal-data
      - name: Palette meets WCAG 2.1 AA
        # Computed from docs/design/palettes.json, not asserted. jsdom has no
        # layout engine, so axe cannot check contrast in the component tests;
        # this is the half of the coverage those tests cannot provide.
        run: npm run check:contrast
      - name: Generated files match their sources
        # tokens.css and the design previews are deterministic: same inputs,
        # same bytes. Regenerating and diffing catches an output edited by hand
        # or a generator changed without a rebuild.
        run: |
          npm run build:tokens
          npm run build:previews
          git diff --exit-code -- apps/client/src/styles/tokens.css docs/design
      - name: The runtime's CLDR data still matches what was recorded
        # Deliberately not part of the diff above. cldr-audit.json records the
        # Node and ICU versions it was produced on, so diffing the whole file
        # would turn every Node patch release into a red build for a reason
        # that has nothing to do with the locale data it exists to protect.
        # `--check` compares the locale findings and reports the environment.
        run: npm run audit:cldr -- --check
      - name: Type-check and build
        run: npm run build
      - name: Tests with coverage
        # Includes the axe pass over the application in Arabic and English,
        # light and dark (apps/client/src/App.test.tsx).
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  ml:
    name: Lint, types and tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly. astral-sh/setup-uv publishes no floating `v10` tag —
      # its movable majors stop at v6 — so `@v10` is unresolvable and the job
      # dies at "Set up job" before a single step runs. Checking the releases
      # API is not the same check: `v10.3.2` exists as a release while `v10`
      # does not exist as a tag.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: apps/ml/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy app tests
      - name: Tests
        run: uv run pytest -q

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scanner walks every blob ever committed, so it needs them all.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan working tree
        run: node scripts/secret-scan.mjs
      - name: Scan entire git history
        run: node scripts/secret-scan.mjs --history

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (fails on high or critical)
        run: npm audit --audit-level=high
      # Pinned exactly. astral-sh/setup-uv publishes no floating `v10` tag —
      # its movable majors stop at v6 — so `@v10` is unresolvable and the job
      # dies at "Set up job" before a single step runs. Checking the releases
      # API is not the same check: `v10.3.2` exists as a release while `v10`
      # does not exist as a tag.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: apps/ml/uv.lock
      - name: pip-audit
        working-directory: apps/ml
        run: |
          uv export --frozen --no-dev --no-emit-project > requirements.txt
          uvx pip-audit --requirement requirements.txt --strict

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: ML image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/ml/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Client image (static build)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/client/Dockerfile
          target: serve
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test through the proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The smoke script needs socket.io-client and otpauth, and nothing else.
      - run: npm ci
      - name: Generate .env
        run: node scripts/setup.mjs
      # `--wait` alone is not enough: a build failure here must fail the job
      # rather than leave the previous image running, which is exactly what
      # `up --build` does locally when a TypeScript error breaks the build.
      - name: Build the images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300
      # The smoke walk signs in as a seeded customer and a seeded admin, and a
      # runner's database is empty. Without this the first run fails at
      # "the code signs the customer in" and every later check fails with it —
      # which is exactly what happened on the first push.
      #
      # `--no-kb --no-seniordata`: TechQA is a 12 GB local download and
      # seniordata.csv is real business data that is git-ignored and must never
      # reach a runner. Neither is needed to walk the conversation.
      - name: Seed the demonstration data
        run: npm run seed:ci
      - name: The ML service refuses an unauthenticated call
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/version)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
      # Everything the unit tests cannot see: cookie `path` scoping, the nginx
      # websocket upgrade, and the containers actually serving the code that
      # was just built. Step 11 shipped three bugs that all lived here while
      # the suite was green.
      - name: Smoke test
        run: npm run smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
