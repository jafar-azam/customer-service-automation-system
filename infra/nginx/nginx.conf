# Local reverse proxy: one origin for the browser, so the client and the API
# are same-origin and cookies behave exactly as they will in production.
# TLS, HSTS and the hardened production configuration are deferred
# (docs/roadmap/PRODUCTION.md, P5).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  log_format csas '$remote_addr - [$time_local] "$request" $status '
                  '$body_bytes_sent rt=$request_time';
  access_log /dev/stdout csas;
  error_log  /dev/stderr warn;

  # Uploads are checked again by the application (type, size, count, malware);
  # this is the outer bound so a huge body never reaches Node at all.
  client_max_body_size 12m;

  upstream csas_server {
    server server:4000;
  }

  upstream csas_client {
    server client:5173;
  }

  server {
    listen 8080;
    server_name localhost;

    location /api/ {
      proxy_pass http://csas_server;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Socket.IO (step 11) needs the connection upgraded, not proxied as HTTP.
    location /socket.io/ {
      proxy_pass http://csas_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_read_timeout 300s;
    }

    # Everything else is the client, including Vite's HMR websocket.
    location / {
      proxy_pass http://csas_client;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
    }
  }
}
