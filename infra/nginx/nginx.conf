# Local reverse proxy: one origin for the browser, so the client and the API
# are same-origin and cookies behave exactly as they will in production.
# TLS, HSTS and the hardened production configuration are deferred
# (docs/roadmap/PRODUCTION.md, P5).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  log_format csas '$remote_addr - [$time_local] "$request" $status '
                  '$body_bytes_sent rt=$request_time';
  access_log /dev/stdout csas;
  error_log  /dev/stderr warn;

  # Uploads are checked again by the application (type, size, count, malware);
  # this is the outer bound so a huge body never reaches Node at all.
  client_max_body_size 12m;

  # Docker's embedded DNS, plus upstreams held in variables. Without this nginx
  # resolves every upstream name once at startup and refuses to start if one is
  # missing — so rebuilding just the client container would crash-loop the
  # proxy. With it, nginx starts regardless and re-resolves every 10s, which
  # also picks up a container that was recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name localhost;

    location /api/ {
      set $upstream_server server:4000;
      proxy_pass http://$upstream_server;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # The server's Prometheus endpoint is deliberately not proxied: metrics
    # describe internal routes, error codes and queue depths, which is
    # reconnaissance material, and a scrape endpoint is cheap to hammer. It
    # stays reachable inside the Compose network. Without this rule the request
    # would fall through to the client and answer 200 with the app shell, which
    # looks like an exposed endpoint to anyone auditing the proxy.
    location = /metrics {
      return 404;
    }

    # Socket.IO (step 11) needs the connection upgraded, not proxied as HTTP.
    location /socket.io/ {
      set $upstream_server server:4000;
      proxy_pass http://$upstream_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_read_timeout 300s;
    }

    # Everything else is the client, including Vite's HMR websocket.
    location / {
      set $upstream_client client:5173;
      proxy_pass http://$upstream_client;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
    }
  }
}
